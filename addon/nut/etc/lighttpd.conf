# etc/lighttpd.conf of lite-addon-nut (MIT): openccu-lite proxies /addons/nut/ to the daemon on
# the loopback and serves the 503 page while it is not running.
$HTTP["url"] == "/addons/nut" {
    url.redirect = ("" => "/addons/nut/")
}
$HTTP["url"] =~ "^/addons/nut/" {
    proxy.server = ("/addons/nut/" => (("host" => "127.0.0.1", "port" => 8297)))
    server.errorfile-prefix = "/usr/local/addons/nut/www/lighttpd-error-"
}
